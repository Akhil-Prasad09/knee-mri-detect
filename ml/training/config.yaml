data_dir: data/raw/MRNet-v1.0
labels: [abnormal, acl, meniscus]
planes: [sagittal, coronal, axial]
backbone: efficientnet_b0   # b3 needs >16 GB unified memory; use b3 + epochs 20 on a CUDA GPU / Colab
img_size: 224
epochs: 5
lr: 1.0e-4
batch_size: 1          # one exam (variable slice count) per step
num_workers: 2
out_dir: ml/models
seed: 42
pretrained: true
